name: Check search schedule
on:
  push:
    paths:
      - 'index.html'
      - 'moose_train_schedule.csv'
      - 'supporting_files/scripts/build_search_schedule.js'
      - 'supporting_files/assets/schedule/**'
      - 'supporting_files/tests/compact_schedule.test.js'
      - '.github/workflows/check-search-schedule.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'moose_train_schedule.csv'
      - 'supporting_files/scripts/build_search_schedule.js'
      - 'supporting_files/assets/schedule/**'
      - 'supporting_files/tests/compact_schedule.test.js'
      - '.github/workflows/check-search-schedule.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node supporting_files/scripts/build_search_schedule.js --check
      - run: node supporting_files/tests/compact_schedule.test.js
